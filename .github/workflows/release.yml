name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - runner: macos-14
            goos: darwin
            goarch: universal
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: |
          go mod download
          go -C tools/goreleaser mod download

      - name: Install Linux GUI build dependencies (Fyne/GLFW)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgl1-mesa-dev \
            xorg-dev

      - name: Setup MSYS2 toolchain
        id: msys2
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build with GoReleaser (single target)
        if: matrix.goos != 'darwin'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          mkdir -p dist
          OUT_FILE="dist/fallout-tracker-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            export CC="${MSYS2_LOCATION//\\//}/ucrt64/bin/gcc.exe"
            test -x "${CC}"
            "${CC}" --version
          fi

          go tool -modfile=tools/goreleaser/go.tool.mod goreleaser build \
            --clean \
            --single-target \
            --id fallout-tracker \
            --output "${OUT_FILE}"

      - name: Build universal macOS binary
        if: matrix.goos == 'darwin'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          flags=(--clean --skip=publish,archive)
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            flags+=(--snapshot)
          fi

          go tool -modfile=tools/goreleaser/go.tool.mod goreleaser release \
            --config .goreleaser.darwin.yaml \
            "${flags[@]}"
          cp dist/fallout-tracker_darwin_all/fallout-tracker dist/fallout-tracker-darwin-universal

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/fallout-tracker-*
          if-no-files-found: error

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Attach binaries to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
