name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - runner: macos-latest
            goos: darwin
            goarch: universal
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/*/go.sum

      - name: Download dependencies
        run: |
          go mod download
          go -C tools/goreleaser mod download

      - name: Install GoReleaser
        shell: bash
        run: |
          mkdir -p tools/bin
          go -C tools/goreleaser build -o ../bin/ github.com/goreleaser/goreleaser/v2

      - name: Install Linux GUI build dependencies (Fyne/GLFW)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgl1-mesa-dev \
            xorg-dev

      - name: Setup MSYS2 toolchain
        id: msys2
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf

      # gcc.exe runs cc1.exe, as.exe and ld.exe, which load their DLLs from
      # PATH, not from gcc's directory. Without UCRT64 on PATH they miss them
      # or load the runner image's own MinGW DLLs and exit silently.
      - name: Add MSYS2 UCRT64 toolchain to PATH
        if: matrix.goos == 'windows'
        shell: bash
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: printf '%s\\ucrt64\\bin\n' "${MSYS2_LOCATION}" >> "${GITHUB_PATH}"

      - name: Build with GoReleaser (single target)
        if: matrix.goos != 'darwin'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          mkdir -p dist
          OUT_FILE="dist/fallout-tracker-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            export CC="${MSYS2_LOCATION//\\//}/ucrt64/bin/gcc.exe"
            test -x "${CC}"
            "${CC}" --version
            echo 'int main(void) { return 0; }' | "${CC}" -x c - -o "${RUNNER_TEMP}/cc-smoke.exe"
          fi

          flags=(--clean --single-target --id fallout-tracker --output "${OUT_FILE}")
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            flags+=(--snapshot)
          fi

          tools/bin/goreleaser build "${flags[@]}"

      - name: Build universal macOS binary
        if: matrix.goos == 'darwin'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          flags=(--clean --skip=publish,archive)
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            flags+=(--snapshot)
          fi

          tools/bin/goreleaser release \
            --config .goreleaser.darwin.yaml \
            "${flags[@]}"
          cp dist/fallout-tracker_darwin_all/fallout-tracker dist/fallout-tracker-darwin-universal

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/fallout-tracker-*
          if-no-files-found: error

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Attach binaries to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
